name: Lean build and axiom audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify source snapshot and record run identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess
          manifest = json.loads(Path('source_manifest.json').read_text())
          for name, expected in manifest['sha256'].items():
              path = Path(name)
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit(f'Invalid manifest path: {name}')
              if hashlib.sha256(path.read_bytes()).hexdigest() != expected:
                  raise SystemExit(f'Source snapshot mismatch: {name}')
          metadata = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'runner_os': os.environ['RUNNER_OS'],
              'toolchain': Path('lean-toolchain').read_text().strip(),
              'source_manifest_sha256': hashlib.sha256(Path('source_manifest.json').read_bytes()).hexdigest(),
          }
          Path('ci-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          print(f"Verified {len(manifest['sha256'])} frozen source/config files")
          PY

      - name: Install pinned Lean toolchain and fetch dependency cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'true'

      - name: Build every project module and audit all public proofs
        run: |
          set -o pipefail
          # Dependency caches are allowed. Project modules are checked afresh.
          rm -rf .lake/build
          python3 check.py 2>&1 | tee ci-check.log

      - name: Require the complete theorem with its proved Furstenberg input
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          result = json.loads(Path('check_result.json').read_text())
          manifest = json.loads(Path('source_manifest.json').read_text())
          if result['source_sha256'] != manifest['sha256']:
              raise SystemExit('Checked source inventory does not match the committed snapshot')
          if result['status'] != 'checked_main_formalization':
              raise SystemExit('The complete main formalization was not verified')
          if result['main_poisson_theorem'] != 'PROVED_FOR_POTENTIAL_LAW':
              raise SystemExit('The final statement still lacks its proved Furstenberg input')
          print('PASS: full build, full public-proof axiom audit, and exact final-statement guards')
          PY

      - name: Save verification logs and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean-verification-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ci-metadata.json
            source_manifest.json
            ci-check.log
            check.log
            axiom_audit.log
            check_result.json
            checked_theorems.json
            AxiomAudit.lean
